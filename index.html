<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HALDEN</title>
<meta name="description" content="HALDEN - a co-op first-person roguelite. Climb the living tower alone or with up to three friends.">
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root { --bg: #14100c; --panel: #1d1712; --ink: #efe6d2; --muted: #b9ab90; --gold: #e6b450; --ember: #e8722c; --line: #3a2e22; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(ellipse at 50% 0%, #2a1d12 0%, var(--bg) 60%); color: var(--ink);
         font: 17px/1.6 Georgia, "Times New Roman", serif; display: flex; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 20px; }
  main img { width: 128px; height: 128px; filter: drop-shadow(0 0 18px rgba(232,114,44,.35)); }
  h1 { font-size: clamp(44px, 9vw, 84px); letter-spacing: .22em; margin: 18px 0 6px; padding-left: .22em; color: var(--gold); }
  .tag { color: var(--muted); font-size: 19px; max-width: 620px; margin: 0 0 26px; }
  .pills { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
  .pills span { border: 1px solid var(--line); background: var(--panel); padding: 6px 14px; border-radius: 999px; font-size: 15px; }
  .contact a { color: var(--gold); }
  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  footer div { max-width: 860px; margin: 0 auto; padding: 14px 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="HALDEN logo">
  <h1>HALDEN</h1>
  <p class="tag">A co-op first-person roguelite. Climb the living tower alone or with up to three friends, wave after wave.</p>
  <div class="pills"><span>Co-op for 1-4 players</span><span>First-person action</span><span>Windows PC</span></div>
  <p class="contact">Contact: <a href="mailto:contact@playhalden.com">contact@playhalden.com</a></p>
</main>
<footer><div><span>&copy; 2026 HALDEN</span><span><a href="privacy.html">Privacy Policy</a></span></div></footer>
</body>
</html>
